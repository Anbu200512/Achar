<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign Up | Achar &mdash; Specialty Pickle &amp; Homemade Preserve Store</title>
  <meta name="description" content="Create an account with Achar to enjoy fresh seasonal batch releases, tasting club member perks, and easy order tracking.">
  <link rel="icon" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="tailwind.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'ui-serif', 'Georgia', 'serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#A31621',
              deep: '#7A1218',
              soft: '#D64530',
              50: '#FDF8F6',
              100: '#F5EBE6',
              200: '#EBD5CC',
              300: '#D9B4A3',
              400: '#C28872',
              500: '#A31621',
              600: '#8E131C',
              700: '#7A1218',
              800: '#5C0D12',
              900: '#3D090C',
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .signup-card {
      backdrop-filter: blur(14px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .signup-card:hover {
      transform: translateY(-2px);
    }

    .input-focus:focus {
      outline: none;
      border-color: #A31621;
      box-shadow: 0 0 0 3px rgba(163, 22, 33, 0.18);
    }

    .dark .input-focus:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
    }

    /* RTL specific adjustments */
    [dir="rtl"] .space-x-reverse {
      flex-direction: row-reverse;
    }

    [dir="rtl"] .text-left {
      text-align: right;
    }

    [dir="rtl"] .mr-2 {
      margin-left: 0.5rem;
      margin-right: 0;
    }

    [dir="rtl"] .password-toggle {
      right: auto;
      left: 1rem;
    }

    /* Custom scrollbar for form content */
    .form-container {
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .form-container::-webkit-scrollbar {
      width: 4px;
    }

    .form-container::-webkit-scrollbar-track {
      background: rgba(163, 22, 33, 0.05);
      border-radius: 10px;
    }

    .form-container::-webkit-scrollbar-thumb {
      background: #A31621;
      border-radius: 10px;
    }

    .dark .form-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    .dark .form-container::-webkit-scrollbar-thumb {
      background: #f59e0b;
    }
  </style>
</head>

<body
  class="min-h-screen flex items-center justify-center p-3 sm:p-4 font-sans antialiased bg-gradient-to-br from-[#FFFDFB] via-[#FAF3F0] to-[#F5EBE6] dark:from-[#0E0607] dark:via-[#160B0D] dark:to-[#0A0405] text-brand dark:text-neutral-100 transition-colors duration-300">

  <div class="w-full max-w-sm md:max-w-md my-6">

    <!-- Top Action Bar (Back to Shop, Theme & RTL Toggles) -->
    <div class="flex items-center justify-between gap-3 mb-4">
      <a href="index.html"
        class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white/90 dark:bg-neutral-900/90 shadow-sm border border-brand/15 dark:border-white/15 text-xs font-semibold text-brand dark:text-amber-300 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200">
        <i class="bi bi-arrow-left"></i>
        <span>Store Home</span>
      </a>

      <div class="flex items-center gap-2">
        <button id="themeToggleBtn" aria-label="Toggle dark mode"
          class="p-2.5 rounded-xl bg-white/90 dark:bg-neutral-900/90 shadow-sm border border-brand/15 dark:border-white/15 text-brand dark:text-amber-300 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200">
          <i id="themeIcon" class="bi bi-moon-fill text-base"></i>
        </button>
        <button id="rtlToggleBtn" aria-label="Toggle RTL direction"
          class="p-2.5 rounded-xl bg-white/90 dark:bg-neutral-900/90 shadow-sm border border-brand/15 dark:border-white/15 text-brand dark:text-amber-300 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200">
          <i class="bi bi-arrow-left-right text-base"></i>
        </button>
      </div>
    </div>

    <!-- Sign Up Card -->
    <div
      class="signup-card bg-white/95 dark:bg-[#180E10]/95 rounded-3xl shadow-2xl shadow-brand/10 dark:shadow-black/60 border border-brand/15 dark:border-white/15 overflow-hidden transition-all duration-300 flex flex-col max-h-[92vh]">

      <!-- Header -->
      <div class="px-6 pt-6 pb-4 text-center border-b border-brand/10 dark:border-white/10 bg-brand/[0.02] dark:bg-white/[0.01] flex-none">
        <a href="index.html" class="inline-flex items-center justify-center gap-3 transition group">
          <img src="images/logo.svg" alt="Achar Logo" class="h-9 w-9 object-contain drop-shadow" />
          <div class="text-left">
            <span class="block font-serif text-2xl font-bold tracking-tight text-brand dark:text-white">Achar</span>
            <span class="block font-sans text-[9px] font-bold uppercase tracking-[0.2em] text-brand-soft dark:text-amber-300">Varanasi &middot; Est. 1948</span>
          </div>
        </a>
        <h1 class="mt-3 font-serif text-xl font-bold text-neutral-900 dark:text-white">Join the Achar Family</h1>
        <p class="text-xs text-neutral-600 dark:text-neutral-400 mt-0.5">Reserve limited seasonal batches and track shipments</p>
      </div>

      <!-- Scrollable Form Container -->
      <div class="form-container px-6 py-5 overflow-y-auto flex-1">
        <form id="signupForm" onsubmit="handleSignup(event)">
          <!-- Full Name Field -->
          <div class="mb-3.5">
            <label for="fullname" class="block text-xs font-semibold uppercase tracking-wider text-neutral-700 dark:text-neutral-200 mb-1.5">
              <i class="bi bi-person-fill mr-1 text-brand-soft dark:text-amber-400"></i> Full Name
            </label>
            <input type="text" id="fullname" name="fullname" required
              class="input-focus w-full px-3.5 py-2.5 rounded-xl border border-brand/20 dark:border-white/15 bg-brand/[0.02] dark:bg-neutral-900/60 text-neutral-900 dark:text-white placeholder-neutral-400 dark:placeholder-neutral-500 text-sm transition-all duration-200"
              placeholder="e.g. Ramesh Chandra">
          </div>

          <!-- Email Field -->
          <div class="mb-3.5">
            <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-neutral-700 dark:text-neutral-200 mb-1.5">
              <i class="bi bi-envelope-fill mr-1 text-brand-soft dark:text-amber-400"></i> Email Address
            </label>
            <input type="email" id="email" name="email" required
              class="input-focus w-full px-3.5 py-2.5 rounded-xl border border-brand/20 dark:border-white/15 bg-brand/[0.02] dark:bg-neutral-900/60 text-neutral-900 dark:text-white placeholder-neutral-400 dark:placeholder-neutral-500 text-sm transition-all duration-200"
              placeholder="you@example.com">
          </div>

          <!-- Password Field with Eye Icon -->
          <div class="mb-3.5">
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-neutral-700 dark:text-neutral-200 mb-1.5">
              <i class="bi bi-lock-fill mr-1 text-brand-soft dark:text-amber-400"></i> Password
            </label>
            <div class="relative">
              <input type="password" id="password" name="password" required
                class="input-focus w-full px-3.5 py-2.5 rounded-xl border border-brand/20 dark:border-white/15 bg-brand/[0.02] dark:bg-neutral-900/60 text-neutral-900 dark:text-white placeholder-neutral-400 dark:placeholder-neutral-500 text-sm transition-all duration-200 pr-10"
                placeholder="Minimum 6 characters">
              <button type="button" id="togglePassword" aria-label="Toggle password visibility"
                class="absolute inset-y-0 right-3 flex items-center text-neutral-400 hover:text-brand dark:hover:text-amber-300 transition">
                <i id="passwordEyeIcon" class="bi bi-eye-slash-fill text-base"></i>
              </button>
            </div>
            <div id="passwordStrength" class="text-xs mt-1"></div>
          </div>

          <!-- Confirm Password Field with Eye Icon -->
          <div class="mb-4">
            <label for="confirmPassword" class="block text-xs font-semibold uppercase tracking-wider text-neutral-700 dark:text-neutral-200 mb-1.5">
              <i class="bi bi-shield-lock-fill mr-1 text-brand-soft dark:text-amber-400"></i> Confirm Password
            </label>
            <div class="relative">
              <input type="password" id="confirmPassword" name="confirmPassword" required
                class="input-focus w-full px-3.5 py-2.5 rounded-xl border border-brand/20 dark:border-white/15 bg-brand/[0.02] dark:bg-neutral-900/60 text-neutral-900 dark:text-white placeholder-neutral-400 dark:placeholder-neutral-500 text-sm transition-all duration-200 pr-10"
                placeholder="Re-enter your password">
              <button type="button" id="toggleConfirmPassword" aria-label="Toggle confirm password visibility"
                class="absolute inset-y-0 right-3 flex items-center text-neutral-400 hover:text-brand dark:hover:text-amber-300 transition">
                <i id="confirmPasswordEyeIcon" class="bi bi-eye-slash-fill text-base"></i>
              </button>
            </div>
          </div>

          <!-- Terms and Conditions -->
          <div class="flex items-start gap-2 mb-4">
            <input type="checkbox" id="termsCheckbox" required
              class="mt-0.5 w-3.5 h-3.5 rounded border-brand/30 dark:border-white/30 text-brand focus:ring-brand dark:focus:ring-amber-400 focus:ring-offset-0">
            <label for="termsCheckbox" class="text-xs text-neutral-600 dark:text-neutral-400 leading-snug">
              I agree to the <a href="#" class="text-brand dark:text-amber-300 font-semibold hover:underline">Terms of Service</a> &amp; <a href="#" class="text-brand dark:text-amber-300 font-semibold hover:underline">Privacy Policy</a>
            </label>
          </div>

          <!-- Sign Up Button -->
          <button type="submit"
            class="w-full bg-gradient-to-r from-brand to-brand-deep hover:from-brand-deep hover:to-brand text-white font-semibold py-3 rounded-xl shadow-lg shadow-brand/25 hover:shadow-brand/40 transition-all duration-300 transform hover:scale-[1.01] text-sm flex items-center justify-center gap-2">
            <i class="bi bi-person-plus-fill"></i>
            <span>Create My Account</span>
          </button>
        </form>

        <!-- Divider -->
        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-brand/10 dark:border-white/10"></div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="px-3 bg-white dark:bg-[#180E10] text-neutral-500 dark:text-neutral-400 font-medium">Or sign up with</span>
          </div>
        </div>

        <!-- Social Sign Up Buttons -->
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button"
            class="flex items-center justify-center gap-2 px-3 py-2 border border-brand/15 dark:border-white/15 rounded-xl text-neutral-700 dark:text-neutral-200 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200 text-xs font-semibold">
            <i class="bi bi-google text-base text-red-500"></i>
            <span>Google</span>
          </button>
          <button type="button"
            class="flex items-center justify-center gap-2 px-3 py-2 border border-brand/15 dark:border-white/15 rounded-xl text-neutral-700 dark:text-neutral-200 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200 text-xs font-semibold">
            <i class="bi bi-apple text-base"></i>
            <span>Apple</span>
          </button>
        </div>

        <!-- Login Link -->
        <p class="text-center text-xs text-neutral-600 dark:text-neutral-400 mt-4 pt-2 border-t border-brand/10 dark:border-white/10">
          Already have an account?
          <a href="login.html" class="font-bold text-brand dark:text-amber-300 hover:text-brand-soft dark:hover:text-amber-200 underline decoration-brand/30 transition">
            Login
          </a>
        </p>
      </div>
    </div>

    <!-- Bottom Footer Note -->
    <p class="text-center text-[11px] text-neutral-500 dark:text-neutral-400 mt-4">
      &copy; 1948&ndash;Present Achar Store Varanasi. All heritage recipes protected.
    </p>
  </div>

  <script>
    // Theme Toggle Functionality
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeIcon(true);
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
        updateThemeIcon(false);
      }
    }

    function updateThemeIcon(isDark) {
      const themeIcon = document.getElementById('themeIcon');
      if (themeIcon) {
        themeIcon.className = isDark ? 'bi bi-sun-fill text-base' : 'bi bi-moon-fill text-base';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        updateThemeIcon(false);
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        updateThemeIcon(true);
      }
    }

    // RTL Toggle Functionality
    function initRTL() {
      const savedDir = localStorage.getItem('dir');
      if (savedDir === 'rtl') {
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
      }
    }

    function toggleRTL() {
      const currentDir = document.documentElement.dir;
      const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
      document.documentElement.dir = newDir;
      localStorage.setItem('dir', newDir);
    }

    // Password Visibility Toggle for Password Field
    function initPasswordToggle() {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('passwordEyeIcon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function () {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          eyeIcon.className = type === 'password' ? 'bi bi-eye-slash-fill text-base' : 'bi bi-eye-fill text-base';
        });
      }
    }

    // Password Visibility Toggle for Confirm Password Field
    function initConfirmPasswordToggle() {
      const toggleBtn = document.getElementById('toggleConfirmPassword');
      const confirmInput = document.getElementById('confirmPassword');
      const eyeIcon = document.getElementById('confirmPasswordEyeIcon');

      if (toggleBtn && confirmInput && eyeIcon) {
        toggleBtn.addEventListener('click', function () {
          const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
          confirmInput.setAttribute('type', type);
          eyeIcon.className = type === 'password' ? 'bi bi-eye-slash-fill text-base' : 'bi bi-eye-fill text-base';
        });
      }
    }

    // Password strength checker
    function checkPasswordStrength(password) {
      let strength = 0;
      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
      if (password.match(/[0-9]/)) strength++;
      if (password.match(/[^a-zA-Z0-9]/)) strength++;
      return strength;
    }

    // Handle Sign Up
    function handleSignup(event) {
      event.preventDefault();

      const fullname = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const termsCheckbox = document.getElementById('termsCheckbox');

      // Validation
      if (!fullname.trim()) {
        alert('Please enter your full name');
        return;
      }

      if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
        alert('Please enter a valid email address');
        return;
      }

      if (password.length < 6) {
        alert('Password must be at least 6 characters long');
        return;
      }

      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }

      if (!termsCheckbox.checked) {
        alert('Please agree to the Terms of Service and Privacy Policy');
        return;
      }

      const strength = checkPasswordStrength(password);
      let strengthMessage = '';
      if (strength === 4) strengthMessage = 'Password Strength: Strong';
      else if (strength === 3) strengthMessage = 'Password Strength: Good';
      else strengthMessage = 'Consider using numbers and symbols for higher security.';

      alert(`Account created successfully!\n\nWelcome to Achar, ${fullname}!\n${strengthMessage}\n\nRedirecting to login...`);

      // Store demo user info
      localStorage.setItem('rememberedEmail', email);
      localStorage.setItem('signupName', fullname);

      // Redirect to login page
      window.location.href = 'login.html';
    }

    // Password strength indicator live feedback
    const passwordInput = document.getElementById('password');
    if (passwordInput) {
      passwordInput.addEventListener('input', function () {
        const strength = checkPasswordStrength(this.value);
        const strengthSpan = document.getElementById('passwordStrength');
        if (strengthSpan) {
          if (this.value.length === 0) {
            strengthSpan.textContent = '';
            strengthSpan.className = 'text-xs mt-1';
          } else if (strength >= 3) {
            strengthSpan.innerHTML = '<i class="bi bi-check-circle-fill text-emerald-500 mr-1 text-[10px]"></i> Strong password';
            strengthSpan.className = 'text-xs mt-1 text-emerald-600 dark:text-emerald-400 font-medium';
          } else if (strength === 2) {
            strengthSpan.innerHTML = '<i class="bi bi-exclamation-triangle-fill text-amber-500 mr-1 text-[10px]"></i> Medium password';
            strengthSpan.className = 'text-xs mt-1 text-amber-600 dark:text-amber-400 font-medium';
          } else {
            strengthSpan.innerHTML = '<i class="bi bi-x-circle-fill text-brand-soft mr-1 text-[10px]"></i> Weak - add uppercase, numbers or symbols';
            strengthSpan.className = 'text-xs mt-1 text-brand-soft dark:text-red-400 font-medium';
          }
        }
      });
    }

    // Attach event listeners
    document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
    document.getElementById('rtlToggleBtn')?.addEventListener('click', toggleRTL);

    // Initialize on page load
    initTheme();
    initRTL();
    initPasswordToggle();
    initConfirmPasswordToggle();
  </script>
</body>

</html>
