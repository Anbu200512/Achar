<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login | Achar &mdash; Specialty Pickle &amp; Homemade Preserve Store</title>
  <meta name="description" content="Login to your Achar account to manage orders, subscriptions, and bulk gifting.">
  <link rel="icon" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="tailwind.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'ui-serif', 'Georgia', 'serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#A31621',
              deep: '#7A1218',
              soft: '#D64530',
              50: '#FDF8F6',
              100: '#F5EBE6',
              200: '#EBD5CC',
              300: '#D9B4A3',
              400: '#C28872',
              500: '#A31621',
              600: '#8E131C',
              700: '#7A1218',
              800: '#5C0D12',
              900: '#3D090C',
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .login-card {
      backdrop-filter: blur(14px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .login-card:hover {
      transform: translateY(-2px);
    }

    .input-focus:focus {
      outline: none;
      border-color: #A31621;
      box-shadow: 0 0 0 3px rgba(163, 22, 33, 0.18);
    }

    .dark .input-focus:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
    }

    /* RTL specific adjustments */
    [dir="rtl"] .space-x-reverse {
      flex-direction: row-reverse;
    }

    [dir="rtl"] .text-left {
      text-align: right;
    }

    [dir="rtl"] .mr-2 {
      margin-left: 0.5rem;
      margin-right: 0;
    }

    [dir="rtl"] .password-toggle {
      right: auto;
      left: 1rem;
    }
  </style>
</head>

<body
  class="min-h-screen flex items-center justify-center p-4 font-sans antialiased bg-gradient-to-br from-[#FFFDFB] via-[#FAF3F0] to-[#F5EBE6] dark:from-[#0E0607] dark:via-[#160B0D] dark:to-[#0A0405] text-brand dark:text-neutral-100 transition-colors duration-300">

  <div class="w-full max-w-md my-8">

    <!-- Top Action Bar (Back to Shop, Theme & RTL Toggles) -->
    <div class="flex items-center justify-between gap-3 mb-6">
      <a href="index.html"
        class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white/90 dark:bg-neutral-900/90 shadow-sm border border-brand/15 dark:border-white/15 text-xs font-semibold text-brand dark:text-amber-300 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200">
        <i class="bi bi-arrow-left"></i>
        <span>Store Home</span>
      </a>

      <div class="flex items-center gap-2">
        <button id="themeToggleBtn" aria-label="Toggle dark mode"
          class="p-2.5 rounded-xl bg-white/90 dark:bg-neutral-900/90 shadow-sm border border-brand/15 dark:border-white/15 text-brand dark:text-amber-300 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200">
          <i id="themeIcon" class="bi bi-moon-fill text-base"></i>
        </button>
        <button id="rtlToggleBtn" aria-label="Toggle RTL direction"
          class="p-2.5 rounded-xl bg-white/90 dark:bg-neutral-900/90 shadow-sm border border-brand/15 dark:border-white/15 text-brand dark:text-amber-300 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200">
          <i class="bi bi-arrow-left-right text-base"></i>
        </button>
      </div>
    </div>

    <!-- Login Card -->
    <div
      class="login-card bg-white/95 dark:bg-[#180E10]/95 rounded-3xl shadow-2xl shadow-brand/10 dark:shadow-black/60 border border-brand/15 dark:border-white/15 overflow-hidden transition-all duration-300">

      <!-- Header -->
      <div class="p-8 pb-6 text-center border-b border-brand/10 dark:border-white/10 bg-brand/[0.02] dark:bg-white/[0.01]">
        <a href="index.html" class="inline-flex items-center justify-center gap-3 transition group">
          <img src="images/logo.svg" alt="Achar Logo" class="h-10 w-10 object-contain drop-shadow" />
          <div class="text-left">
            <span class="block font-serif text-2xl font-bold tracking-tight text-brand dark:text-white">Achar</span>
            <span class="block font-sans text-[10px] font-bold uppercase tracking-[0.2em] text-brand-soft dark:text-amber-300">Varanasi &middot; Est. 1948</span>
          </div>
        </a>
        <h1 class="mt-4 font-serif text-xl font-bold text-neutral-900 dark:text-white">Welcome back to the counter</h1>
        <p class="text-xs text-neutral-600 dark:text-neutral-400 mt-1">Login to view orders, seasonal jars &amp; member benefits</p>
      </div>

      <!-- Login Form -->
      <div class="p-8 pt-6">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <!-- Email Field -->
          <div class="mb-5">
            <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-neutral-700 dark:text-neutral-200 mb-2">
              <i class="bi bi-envelope-fill mr-1.5 text-brand-soft dark:text-amber-400"></i> Email Address
            </label>
            <input type="email" id="email" name="email" required
              class="input-focus w-full px-4 py-3 rounded-xl border border-brand/20 dark:border-white/15 bg-brand/[0.02] dark:bg-neutral-900/60 text-neutral-900 dark:text-white placeholder-neutral-400 dark:placeholder-neutral-500 text-sm transition-all duration-200"
              placeholder="you@example.com">
          </div>

          <!-- Password Field with Eye Icon -->
          <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
              <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-neutral-700 dark:text-neutral-200">
                <i class="bi bi-lock-fill mr-1.5 text-brand-soft dark:text-amber-400"></i> Password
              </label>
              <a href="#" class="text-xs text-brand-soft dark:text-amber-300 hover:underline transition font-medium">
                Forgot password?
              </a>
            </div>
            <div class="relative">
              <input type="password" id="password" name="password" required
                class="input-focus w-full px-4 py-3 rounded-xl border border-brand/20 dark:border-white/15 bg-brand/[0.02] dark:bg-neutral-900/60 text-neutral-900 dark:text-white placeholder-neutral-400 dark:placeholder-neutral-500 text-sm transition-all duration-200 pr-12"
                placeholder="Enter your password">
              <button type="button" id="togglePassword" aria-label="Toggle password visibility"
                class="absolute inset-y-0 right-3 flex items-center text-neutral-400 hover:text-brand dark:hover:text-amber-300 transition">
                <i id="passwordEyeIcon" class="bi bi-eye-slash-fill text-lg"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me -->
          <div class="flex items-center justify-between mb-6">
            <label class="flex items-center cursor-pointer select-none">
              <input type="checkbox" id="rememberMe"
                class="w-4 h-4 rounded border-brand/30 dark:border-white/30 text-brand focus:ring-brand dark:focus:ring-amber-400 focus:ring-offset-0">
              <span class="ml-2 text-xs text-neutral-600 dark:text-neutral-400">Remember my details</span>
            </label>
            <span class="text-[11px] text-neutral-400 dark:text-neutral-500 flex items-center gap-1">
              <i class="bi bi-shield-check text-emerald-500"></i> 256-bit secure
            </span>
          </div>

          <!-- Login Button -->
          <button type="submit"
            class="w-full bg-gradient-to-r from-brand to-brand-deep hover:from-brand-deep hover:to-brand text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-brand/25 hover:shadow-brand/40 transition-all duration-300 transform hover:scale-[1.01] text-sm flex items-center justify-center gap-2">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Login to Account</span>
          </button>
        </form>

        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-brand/10 dark:border-white/10"></div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="px-3 bg-white dark:bg-[#180E10] text-neutral-500 dark:text-neutral-400 font-medium">Or continue with</span>
          </div>
        </div>

        <!-- Social Login Buttons -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button"
            class="flex items-center justify-center gap-2 px-4 py-2.5 border border-brand/15 dark:border-white/15 rounded-xl text-neutral-700 dark:text-neutral-200 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200 text-xs font-semibold">
            <i class="bi bi-google text-base text-red-500"></i>
            <span>Google</span>
          </button>
          <button type="button"
            class="flex items-center justify-center gap-2 px-4 py-2.5 border border-brand/15 dark:border-white/15 rounded-xl text-neutral-700 dark:text-neutral-200 hover:bg-brand/5 dark:hover:bg-white/5 transition-all duration-200 text-xs font-semibold">
            <i class="bi bi-apple text-base"></i>
            <span>Apple</span>
          </button>
        </div>

        <!-- Sign Up Link -->
        <p class="text-center text-xs text-neutral-600 dark:text-neutral-400 mt-6 pt-2 border-t border-brand/10 dark:border-white/10">
          New to Achar family?
          <a href="signup.html" class="font-bold text-brand dark:text-amber-300 hover:text-brand-soft dark:hover:text-amber-200 underline decoration-brand/30 transition">
            Create an Account
          </a>
        </p>
      </div>
    </div>

    <!-- Bottom Footer Note -->
    <p class="text-center text-[11px] text-neutral-500 dark:text-neutral-400 mt-6">
      &copy; 1948&ndash;Present Achar Store Varanasi. All heritage recipes protected.
    </p>
  </div>

  <script>
    // Theme Toggle Functionality
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeIcon(true);
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
        updateThemeIcon(false);
      }
    }

    function updateThemeIcon(isDark) {
      const themeIcon = document.getElementById('themeIcon');
      if (themeIcon) {
        themeIcon.className = isDark ? 'bi bi-sun-fill text-base' : 'bi bi-moon-fill text-base';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        updateThemeIcon(false);
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        updateThemeIcon(true);
      }
    }

    // RTL Toggle Functionality
    function initRTL() {
      const savedDir = localStorage.getItem('dir');
      if (savedDir === 'rtl') {
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
      }
    }

    function toggleRTL() {
      const currentDir = document.documentElement.dir;
      const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
      document.documentElement.dir = newDir;
      localStorage.setItem('dir', newDir);
    }

    // Password Visibility Toggle
    function initPasswordToggle() {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('passwordEyeIcon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function () {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          eyeIcon.className = type === 'password' ? 'bi bi-eye-slash-fill text-lg' : 'bi bi-eye-fill text-lg';
        });
      }
    }

    // Handle Login
    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe')?.checked || false;

      // Store remember me preference
      if (rememberMe) {
        localStorage.setItem('rememberedEmail', email);
      } else {
        localStorage.removeItem('rememberedEmail');
      }

      if (email && password.length >= 4) {
        alert('Welcome back to Achar!\n\nLogin successful. Redirecting to store catalogue...');
        window.location.href = 'products.html';
      } else {
        alert('Please enter a valid email and password (minimum 4 characters).');
      }
    }

    // Load remembered email if exists
    function loadRememberedEmail() {
      const rememberedEmail = localStorage.getItem('rememberedEmail');
      if (rememberedEmail && document.getElementById('email')) {
        document.getElementById('email').value = rememberedEmail;
        const rememberCheckbox = document.getElementById('rememberMe');
        if (rememberCheckbox) rememberCheckbox.checked = true;
      }
    }

    // Attach event listeners
    document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
    document.getElementById('rtlToggleBtn')?.addEventListener('click', toggleRTL);

    // Initialize on page load
    initTheme();
    initRTL();
    initPasswordToggle();
    loadRememberedEmail();
  </script>
</body>

</html>
