    :root {
      --home-bg: #ffffff;
      --text-color: #a31621;
    }

    [data-theme="dark"] {
      --home-bg: #000000;
      --text-color: #ffffff;

    body {
      background-color: var(--home-bg) !important;
      color: var(--text-color);

  <script>
    (function () {
      const t = localStorage.getItem('theme') || 'light';
      const html = document.documentElement;
      html.setAttribute('data-theme', t);
      html.classList.toggle('dark', t === 'dark');
    })();
  </script>
